// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    // AzNavRail 9.0 is built against Kotlin 2.3.21 / AGP 9.2.1, so the consumer
    // app has to match — older Kotlin can't read the AAR's metadata.
    ext.kotlin_version = "2.3.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.2.1"
        // AGP 9.0+ has built-in Kotlin support; the kotlin-gradle-plugin
        // classpath entry is intentionally omitted. Only the Compose Compiler
        // plugin needs separate classpath bootstrapping.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
