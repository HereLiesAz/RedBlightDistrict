android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37

# Compose + Kotlin 2.x + AzNavRail's transitive Compose deps blow past the
# Gradle daemon's default heap (~512 MB) during kapt/k2 compilation, which
# makes the daemon GC-thrash and gets killed on GitHub Actions' 7 GB runners.
# Give it room to actually finish the build.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Pin the Kotlin daemon heap too — Compose lowering is memory-heavy.
kotlin.daemon.jvm.options=-Xmx2g
